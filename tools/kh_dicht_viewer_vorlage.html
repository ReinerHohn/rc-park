<title>Kaufhaus Dichtewolke</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Vollbild-3D-Fenster, links schmales Bedienfeld (am Handy oben), Punktwolke in Fotofarben auf neutralem Grund */
:root{
  --bg:#eceae6; --panel:#f8f7f4; --fg:#23262b; --mute:#5d636b; --line:#cfcbc3; --accent:#b4531f; --szene:#d9d6d0; --gitter:#9b978f;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-zahl:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1d2025; --fg:#e6e7e9; --mute:#9aa0a8; --line:#33373e; --accent:#e08a4f; --szene:#0f1115; --gitter:#4a4f57; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1d2025; --fg:#e6e7e9; --mute:#9aa0a8; --line:#33373e; --accent:#e08a4f; --szene:#0f1115; --gitter:#4a4f57; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px}
h1{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
header p{margin:0;color:var(--mute);font-size:12.5px}
main{flex:1;min-height:0;display:flex;gap:12px}
#bühne{flex:1;min-width:0;position:relative;background:var(--szene);border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
aside{width:250px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:14px;overflow:auto}
aside h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;font-weight:600}
label{display:flex;align-items:center;gap:8px;min-height:28px;cursor:pointer}
.n{margin-left:auto;font-family:var(--font-zahl);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.knoepfe{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
dt{color:var(--mute)} dd{margin:0;font-family:var(--font-zahl);text-align:right;font-variant-numeric:tabular-nums}
.hinweis{font-size:12px;color:var(--mute);line-height:1.45;margin:0}
#massstab{position:absolute;left:12px;bottom:10px;font-family:var(--font-zahl);font-size:12px;color:var(--fg);pointer-events:none}
#massstab i{display:block;height:6px;border:1.5px solid var(--fg);border-top:none;margin-bottom:3px}
@media (max-width:720px){main{flex-direction:column-reverse}aside{width:auto;max-height:42%}#bühne{min-height:300px}}
</style>
<header><h1>@@TITEL@@</h1><p id="kopf"></p></header>
<main>
  <div id="bühne"><canvas id="c"></canvas><div id="massstab"><i id="msb"></i><span id="mst"></span></div></div>
  <aside>
    <section><h2>Ebenen</h2><div id="ebenen"></div></section>
    <section><h2>Farbe</h2>
      <label><input type="radio" name="fm" value="foto" checked> Fotofarben</label>
      <label><input type="radio" name="fm" value="hoehe"> Höhe (z)</label></section>
    <section><h2>Netz-Deckkraft</h2><input type="range" id="nd" min="0.1" max="1" step="0.05" value="0.75" aria-label="Netz-Deckkraft"></section>
    <section><h2>Punktgröße</h2><input type="range" id="gr" min="1" max="8" step="0.5" value="2.5" aria-label="Punktgröße"></section>
    <section><h2>Ansicht</h2><div class="knoepfe"><button data-a="schraeg">Schräg</button><button data-a="oben">Von oben</button><button data-a="seite">Seite</button><button data-a="front">Front</button></div></section>
    <section><h2>Maße</h2><dl id="mass"></dl></section>
    <p class="hinweis">Achsen sind Modellachsen, keine Himmelsrichtungen. Ziehen dreht, Rad zoomt, rechte Maustaste oder zwei Finger verschieben. Punkte sind ungefiltert aus der dichten Rekonstruktion, nicht aus dem Generator.</p>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATEN = /*DATEN*/[];
const NETZE = /*NETZE*/[];
const FARBEN_EBENE = ["#e0a458","#58a6e0","#7cc47c","#c47cc4","#e06c6c","#c4c458"];
const b64 = s => { const r = atob(s), u = new Uint8Array(r.length); for (let i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; };
const cv = document.getElementById("c"), bühne = document.getElementById("bühne");
const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true});
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 2000); cam.up.set(0, 0, 1);
const ctl = new THREE.OrbitControls(cam, cv); ctl.enableDamping = true;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let grid = null;
const ebenen = [], lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9]; let nges = 0;
DATEN.forEach((d, k) => {
  const q = new Uint16Array(b64(d.pos).buffer), c8 = b64(d.farbe), n = d.n, P = new Float32Array(n * 3), Cf = new Float32Array(n * 3), Ch = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) for (let a = 0; a < 3; a++) {
    const v = d.lo[a] + q[i * 3 + a] / 65535 * d.spanne[a]; P[i * 3 + a] = v; if (v < lo[a]) lo[a] = v; if (v > hi[a]) hi[a] = v; Cf[i * 3 + a] = c8[i * 3 + a] / 255;
  }
  nges += n; ebenen.push({d, n, P, Cf, Ch, an: d.an !== false, farbe: FARBEN_EBENE[k % FARBEN_EBENE.length]});
});
const netzObj = NETZE.map(N => { const g = new THREE.BufferGeometry(), V = new Float32Array(b64(N.pos).buffer), I = new Uint32Array(b64(N.idx).buffer), C8 = b64(N.farbe), C = new Float32Array(N.nv * 3);
  for (let i = 0; i < C.length; i++) C[i] = C8[i] / 255; g.setAttribute("position", new THREE.BufferAttribute(V, 3)); g.setAttribute("color", new THREE.BufferAttribute(C, 3)); g.setIndex(new THREE.BufferAttribute(I, 1));
  const mat = new THREE.MeshBasicMaterial({vertexColors: true, transparent: true, opacity: .75, side: THREE.DoubleSide}), mesh = new THREE.Mesh(g, mat); mesh.visible = N.an !== false;
  const wf = new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({color: 0x000000, transparent: true, opacity: .08})); mesh.add(wf); return {N, mesh, mat}; });
const zlo = lo[2], zsp = Math.max(hi[2] - lo[2], 1e-6);
function rampe(t) { t = Math.min(1, Math.max(0, t)); const s = [[.27,.0,.33],[.23,.32,.55],[.13,.57,.55],[.37,.79,.38],[.99,.91,.15]], x = t * 4, i = Math.min(3, Math.floor(x)), f = x - i; return s[i].map((v, j) => v + (s[i + 1][j] - v) * f); }
ebenen.forEach(e => { for (let i = 0; i < e.n; i++) { const c = rampe((e.P[i * 3 + 2] - zlo) / zsp); e.Ch.set(c, i * 3); } });
const mitte = new THREE.Vector3((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2);
netzObj.forEach(o => { o.mesh.position.set(-mitte.x, -mitte.y, -mitte.z); scene.add(o.mesh); });
ebenen.forEach(e => {
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(e.P, 3)); g.setAttribute("color", new THREE.BufferAttribute(e.Cf, 3));
  e.mat = new THREE.PointsMaterial({size: 2.5, sizeAttenuation: false, vertexColors: true}); e.pts = new THREE.Points(g, e.mat); e.pts.position.sub(mitte); e.pts.visible = e.an; scene.add(e.pts);
});
const spanXY = Math.max(hi[0] - lo[0], hi[1] - lo[1]), zelle = spanXY > 60 ? 10 : 5;
function baueGitter() {
  if (grid) { scene.remove(grid); grid.geometry.dispose(); }
  const m = Math.ceil(spanXY * 0.75 / zelle) * zelle, pts = [];
  for (let v = -m; v <= m; v += zelle) { pts.push(-m, v, 0, m, v, 0, v, -m, 0, v, m, 0); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  grid = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color: new THREE.Color(css("--gitter")), transparent: true, opacity: .55}));
  grid.position.z = lo[2] - mitte.z; scene.add(grid); scene.background = new THREE.Color(css("--szene"));
}
baueGitter(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(baueGitter, 50));
new MutationObserver(() => setTimeout(baueGitter, 50)).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

const R = Math.max(spanXY, hi[2] - lo[2]);
function ansicht(a) {
  const r = R * 1.6, t = new THREE.Vector3(0, 0, 0);
  const pos = {schraeg: [r * .7, -r * .8, r * .55], oben: [0, -.001, r * 1.3], seite: [r * 1.2, 0, 0], front: [0, -r * 1.2, 0]}[a];
  cam.position.set(...pos); ctl.target.copy(t); ctl.update();
}
ansicht("schraeg");
document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => ansicht(b.dataset.a));

const box = document.getElementById("ebenen");
ebenen.forEach((e, k) => {
  const l = document.createElement("label"), id = "eb" + k;
  l.innerHTML = `<input type="checkbox" id="${id}" ${e.an ? "checked" : ""}><span style="width:10px;height:10px;border-radius:2px;background:${e.farbe};flex:none"></span><span>${e.d.tag.replace(/_/g, " ")}</span><span class="n">${e.n.toLocaleString("de-DE")}</span>`;
  l.querySelector("input").onchange = ev => { e.an = ev.target.checked; e.pts.visible = e.an; stat(); }; box.appendChild(l);
});
netzObj.forEach((o, k) => { const l = document.createElement("label"), s = o.N.stat;
  l.innerHTML = `<input type="checkbox" ${o.N.an !== false ? "checked" : ""}><span style="width:10px;height:10px;border-radius:2px;background:linear-gradient(90deg,#2b5cff,#fff,#ff3b2b);flex:none"></span><span>${o.N.name}</span><span class="n">${o.N.nf.toLocaleString("de-DE")} Fl.</span>`;
  l.querySelector("input").onchange = ev => o.mesh.visible = ev.target.checked; box.appendChild(l);
  const p = document.createElement("p"); p.className = "hinweis"; p.innerHTML = `Netz-Abweichung zur Wolke: Median ${(s.median_abw_m * 100).toFixed(0)} cm, 90 % unter ${(s.p90_abw_m * 100).toFixed(0)} cm; ${(s.luecke_anteil * 100).toFixed(0)} % grau (zu wenig Wolke, Lücke). <b style="color:#ff3b2b">Rot</b> = Wolke vor dem Modell, <b style="color:#2b5cff">Blau</b> = Modell steht vor der Wolke.`; box.appendChild(p); });
function stat() {
  const n = ebenen.filter(e => e.an).reduce((s, e) => s + e.n, 0);
  document.getElementById("kopf").textContent = `${n.toLocaleString("de-DE")} Punkte sichtbar von ${nges.toLocaleString("de-DE")}`;
}
stat();
const f1 = x => x.toFixed(1).replace(".", ",") + " m";
document.getElementById("mass").innerHTML = `<dt>Breite x</dt><dd>${f1(hi[0] - lo[0])}</dd><dt>Tiefe y</dt><dd>${f1(hi[1] - lo[1])}</dd><dt>Höhe z</dt><dd>${f1(hi[2] - lo[2])}</dd><dt>Ebenen</dt><dd>${ebenen.length}</dd>`;
document.querySelectorAll("input[name=fm]").forEach(r => r.onchange = () => {
  ebenen.forEach(e => { const a = e.pts.geometry.attributes.color; a.array = r.value === "foto" && r.checked ? e.Cf : (r.checked && r.value === "hoehe" ? e.Ch : a.array); a.needsUpdate = true; });
});
document.getElementById("nd").oninput = ev => netzObj.forEach(o => o.mat.opacity = +ev.target.value);
document.getElementById("gr").oninput = ev => ebenen.forEach(e => e.mat.size = +ev.target.value);

function groesse() { const w = bühne.clientWidth, h = bühne.clientHeight; renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
new ResizeObserver(groesse).observe(bühne); groesse();
const msb = document.getElementById("msb"), mst = document.getElementById("mst");
function massstab() {
  const d = cam.position.distanceTo(ctl.target), px_pro_m = bühne.clientHeight / (2 * Math.tan(cam.fov * Math.PI / 360) * d);
  const ziel = 110 / px_pro_m, e = Math.pow(10, Math.floor(Math.log10(ziel))), m = [1, 2, 5, 10].map(f => f * e).reduce((a, b) => Math.abs(b - ziel) < Math.abs(a - ziel) ? b : a);
  msb.style.width = (m * px_pro_m) + "px"; mst.textContent = (m >= 1 ? m : m.toFixed(1).replace(".", ",")) + " m";
}
try { ctl.update(); massstab(); renderer.render(scene, cam); document.getElementById('kopf').textContent += ' · gezeichnet: ' + renderer.info.render.points + ' Punkte, ' + renderer.info.render.triangles + ' Flächen, Kamera ' + cam.position.toArray().map(v => v.toFixed(0)).join('/'); } catch (e) { console.error(e); document.title += ' [Fehler: ' + e.message + ']'; }
(function loop() { requestAnimationFrame(loop); ctl.update(); massstab(); renderer.render(scene, cam); })();
</script>
