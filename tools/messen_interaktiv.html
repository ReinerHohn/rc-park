<!doctype html><meta charset=utf-8><title>Wolke messen</title><style>
body{margin:0;font:15px system-ui;background:#1b1b1b;color:#eee;display:flex}#l{padding:8px}#r{width:460px;position:sticky;top:0;padding:12px;overflow:auto;height:100vh;box-sizing:border-box}
canvas{cursor:crosshair;max-width:calc(100vw - 460px);height:auto}button{font-size:15px;padding:8px 12px;margin:4px 4px 4px 0;border:0;border-radius:6px;cursor:pointer}
.ok{background:#2e7d32;color:#fff}.no{background:#b71c1c;color:#fff}.sk{background:#555;color:#fff}#frage{font-size:19px;font-weight:600;margin:6px 0 10px}img.g{width:32%;margin:6px 0.5% 0 0;border:1px solid #444;vertical-align:top}.lst div{padding:1px 0;color:#999}.lst .fertig{color:#6c6}.lst .jetzt{color:#fff;font-weight:700}.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;width:35%;background:#4caf50;border-radius:3px;animation:lauf 1.1s ease-in-out infinite}@keyframes lauf{0%{margin-left:-35%}100%{margin-left:100%}}</style>
<div id=l><select id=foto></select> <button class=sk id=m0 onclick=modus(0)>Rechteck</button><button class=sk id=m1 onclick=modus(1)>Punkt</button><button class=sk id=m2 onclick=modus(2)>Linie/Freihand</button> <span id=info></span><br><canvas id=c></canvas></div>
<div id=r><div id=frage></div><div id=nav><button class=sk onclick=weiter()>Überspringen (nicht sichtbar)</button><button class=sk onclick=zurueck()>← Zurück</button></div><img id=hilfe style='width:100%;max-height:200px;object-fit:contain;border:1px solid #444;margin-bottom:6px'><div>Rotes Ziel = ungefaehre Stelle im Modell. Markiere sie im Foto.</div><div id=res></div><div id=bt></div><div id=gp></div><h4>Liste</h4><div class=lst id=lst></div></div>
<script>
let pth=null,md=0,pf=[],L=[],i=0,foto='',img=new Image(),box=null,drag=null,mess=null,erg={};const c=document.getElementById('c'),x=c.getContext('2d');
async function api(p,b){const r=await fetch(p,b?{method:'POST',body:JSON.stringify(b)}:{});return r.json()}
function modus(k){md=k;box=null;pf=[];zeichne();[0,1,2].forEach(j=>document.getElementById('m'+j).style.outline=j==k?'3px solid #0f0':'none')}
function zeichne(){x.drawImage(img,0,0,c.width,c.height);if(box&&md!=2){x.strokeStyle='#0f0';x.lineWidth=2;x.strokeRect(box[0],box[1],box[2]-box[0],box[3]-box[1])}if(pf.length>1){x.strokeStyle='#0f0';x.lineWidth=5;x.globalAlpha=.55;x.beginPath();pf.forEach((q,j)=>j?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke();x.globalAlpha=1}}
function liste(){document.getElementById('lst').innerHTML=L.map((e,k)=>`<div class="${erg[e.id]?'fertig':k==i?'jetzt':''}">${erg[e.id]?'✔':k==i?'▶':'·'} ${e.id}${erg[e.id]?' u='+erg[e.id].u+' z='+erg[e.id].z:''}</div>`).join('');
 document.getElementById('frage').textContent=i<L.length?L[i].frage:'Fertig – alle Features gefragt.';document.getElementById('hilfe').src=i<L.length?'/hilfe?id='+L[i].id:''}
async function ladeFoto(n){foto=n;img=new Image();img.onload=()=>{c.width=1613;c.height=Math.round(img.naturalHeight*1613/img.naturalWidth);zeichne()};img.src='/foto?n='+encodeURIComponent(n)}
function pos(e){const r=c.getBoundingClientRect(),k=c.width/r.width;return [(e.clientX-r.left)*k,(e.clientY-r.top)*k]}
c.onmousedown=e=>{drag=pos(e);box=null;pf=md==2?[drag]:[]};
c.onmousemove=e=>{if(!drag)return;const q=pos(e);if(md==2){pf.push(q)}else box=[drag[0],drag[1],q[0],q[1]];zeichne()};
c.onmouseup=async e=>{if(!drag)return;const q=pos(e);let b,path=null;if(md==1){b=[q[0]-6,q[1]-6,q[0]+6,q[1]+6]}else if(md==2){if(pf.length<4){drag=null;return}path=pf.filter((_,j)=>j%3==0);const X=path.map(p=>p[0]),Y=path.map(p=>p[1]);b=[Math.min(...X),Math.min(...Y),Math.max(...X),Math.max(...Y)]}else{if(!box||Math.abs(box[2]-box[0])<4){drag=null;return}b=[Math.min(box[0],box[2]),Math.min(box[1],box[3]),Math.max(box[0],box[2]),Math.max(box[1],box[3])]}
 drag=null;box=b;zeichne();
 document.getElementById('res').innerHTML='<div>Messe in der Wolke …</div><div class=bar><i></i></div>';const r=await api('/messen',{foto,box:b,pfad:path,id:L[i].id});mess=r;pth=path;
 if(!r.ok){document.getElementById('res').textContent='Zu wenig Wolkenpunkte unter der Markierung (auch nach Vergroessern). Anders markieren oder ueberspringen.';document.getElementById('gp').innerHTML='';document.getElementById('bt').innerHTML='<button class=sk onclick=weiter()>Überspringen</button>';return}
 const m=r.mess;document.getElementById('res').innerHTML=`<b>u ${m.u}</b> (${m.u_p10_p90}) &nbsp; n ${m.n} &nbsp; <b>z ${m.z}</b> (${m.z_p10_p90}) &nbsp; ${m.punkte} Pkt`+(m.box_erweitert?`<br><span style="color:#fa0">Box wurde x${m.box_erweitert} vergroessert (zu wenig Punkte)</span>`:'')+(m.kreis_u_z?`<br>Kreis: Mitte u ${m.kreis_u_z.mitte_u} z ${m.kreis_u_z.mitte_z}, <b>Radius ${m.kreis_u_z.radius}</b> (Rest ${m.kreis_u_z.rms}) &nbsp; Ausdehnung u ${m.u_min_max} z ${m.z_min_max}`:'')+(m.kasten?`<br><b>Rechteck auf Fassade:</b> Breite ${m.kasten.breite} m, Hoehe ${m.kasten.hoehe} m &nbsp; u ${m.kasten.u_min}..${m.kasten.u_max} &nbsp; z ${m.kasten.z_min}..${m.kasten.z_max}`:'');
 document.getElementById('gp').innerHTML='<div>Gegenproben werden geladen (Sichtlinientest, 3 Fotos) …</div><div class=bar><i></i></div>';api('/gegen',{foto,xyz:m.xyz}).then(g=>{if(mess!==r)return;mess.gegen=g.gegen;document.getElementById('gp').innerHTML=(g.hinweis?'<div style="color:#fa0">'+g.hinweis+'</div>':'')+'<div>Gegenprobe – liegt das Kreuz auf demselben Feature?</div>'+g.gegen.map(q=>`<img class=g src="data:image/jpeg;base64,${q.jpg}" title="${q.foto}">`).join('')});
 if(r.warnung)document.getElementById('res').innerHTML+='<div style="color:#f55;font-weight:700;margin-top:6px">'+r.warnung+'</div>';document.getElementById('bt').innerHTML='<button class=ok onclick=uebernehmen(true)>Passt – übernehmen</button><button class=no onclick=uebernehmen(false)>Falsch</button><button class=sk onclick=weiter()>Überspringen</button>'};
async function uebernehmen(ja){if(ja){await api('/uebernehmen',{id:L[i].id,foto,box,pfad:pth,mess:mess.mess,gegen:mess.gegen.map(g=>g.foto)});erg[L[i].id]=mess.mess;weiter()}else{box=null;zeichne();document.getElementById('res').textContent='Verworfen – neue Markierung ziehen oder überspringen.';document.getElementById('gp').innerHTML='';document.getElementById('bt').innerHTML='<button class=sk onclick=weiter()>Überspringen</button>'}}
function zurueck(){i=Math.max(0,i-1);box=null;pf=[];mess=null;zeichne();['res','gp','bt'].forEach(k=>document.getElementById(k).innerHTML='');liste()}
function weiter(){i++;box=null;mess=null;zeichne();['res','gp','bt'].forEach(k=>document.getElementById(k).innerHTML='');liste()}
(async()=>{const d=await api('/start');L=d.liste;erg=d.erg;i=L.findIndex(e=>!erg[e.id]);if(i<0)i=L.length;const s=document.getElementById('foto');d.fotos.forEach(n=>{const o=document.createElement('option');o.textContent=n;s.appendChild(o)});s.value=d.foto;s.onchange=()=>ladeFoto(s.value);ladeFoto(d.foto);liste();modus(0)})();
</script>
