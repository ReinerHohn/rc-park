<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>3D-Scan Ansicht</title>
<style>
  html,body{margin:0;height:100%;background:#1e1f24;color:#ddd;font:14px system-ui,sans-serif;overflow:hidden}
  #info{position:absolute;top:10px;left:12px;background:#0008;padding:8px 12px;border-radius:6px;line-height:1.5}
  button{margin-top:4px;margin-right:4px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="info">
  <div id="status">Lade Modell…</div>
  Linke Maus: drehen · Rechte Maus: verschieben · Rad: zoomen<br>
  <button id="tex">Textur an/aus</button><button id="wire">Drahtgitter</button><button id="reset">Ansicht zurück</button>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {EXRLoader} from 'three/addons/loaders/EXRLoader.js';

const status = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1f24);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.001, 1000);
const controls = new OrbitControls(camera, renderer.domElement);

// Modell-Datei: ?obj=name.obj (Standard: Meshroom-Ausgabe texturedMesh.obj)
const objFile = new URLSearchParams(location.search).get('obj') || 'texturedMesh.obj';
const mtlFile = objFile.replace(/\.obj$/i, '.mtl');

// Texturen aus der MTL lesen (newmtl -> map_Kd), EXR oder normale Bilder
const textures = {};
const mtl = await fetch(mtlFile).then(r => r.ok ? r.text() : '').catch(() => '');
const texNames = {};
let cur = null;
for (const line of mtl.split('\n')) {
  const [k, ...rest] = line.trim().split(/\s+/);
  if (k === 'newmtl') cur = rest.join(' ');
  if (k === 'map_Kd' && cur) texNames[cur] = rest.join(' ');
}
await Promise.all(Object.entries(texNames).map(async ([m,f]) => {
  status.textContent = 'Lade Textur ' + f + '…';
  const isExr = /\.exr$/i.test(f);
  const t = await (isExr ? new EXRLoader() : new THREE.TextureLoader()).loadAsync(f);
  t.colorSpace = isExr ? THREE.LinearSRGBColorSpace : THREE.SRGBColorSpace;
  textures[m] = t;
}));

status.textContent = 'Lade Netz (OBJ)…';
const obj = await new OBJLoader().loadAsync(objFile);
const texMats = [], plainMat = new THREE.MeshStandardMaterial({color:0xbbbbbb, side:THREE.DoubleSide, roughness:0.9});
let tris = 0;
obj.traverse(o => {
  if (!o.isMesh) return;
  o.geometry.computeVertexNormals();
  tris += o.geometry.attributes.position.count / 3;
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  const nm = mats.map(m => {
    const mm = textures[m.name]
      ? new THREE.MeshBasicMaterial({map:textures[m.name], side:THREE.DoubleSide})
      : plainMat;
    texMats.push(mm); return mm;
  });
  o.material = Array.isArray(o.material) ? nm : nm[0];
  o.userData.texMat = o.material;
});
scene.add(obj);

// Zentrieren + Kamera einpassen
const box = new THREE.Box3().setFromObject(obj);
const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
obj.position.sub(center);
function resetView(){
  camera.position.set(0, size*0.3, size*0.9);
  camera.near = size/1000; camera.far = size*20; camera.updateProjectionMatrix();
  controls.target.set(0,0,0); controls.update();
}
resetView();
status.textContent = `Fertig · ${Math.round(tris).toLocaleString('de')} Dreiecke`;

let texOn = true, wire = false;
document.getElementById('tex').onclick = () => {
  texOn = !texOn;
  obj.traverse(o => { if (o.isMesh) o.material = texOn ? o.userData.texMat : plainMat; });
};
document.getElementById('wire').onclick = () => {
  wire = !wire; texMats.forEach(m => m.wireframe = wire); plainMat.wireframe = wire;
};
document.getElementById('reset').onclick = resetView;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
